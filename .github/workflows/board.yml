name: auto-board
on:
  schedule:
    - cron: '*/15 * * * 1-5'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install yfinance pandas numpy
      - run: python board_engine.py
      - run: |
          git config user.name auto-board
          git config user.email auto@board
          git add index.html
          git diff --cached --quiet || git commit -m "board $(date -u +%H:%M)"
          git push
