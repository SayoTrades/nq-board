<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NQ System — Live Board</title>
<style>
body{margin:0;background:#101318;color:#dae0ea;font:15px -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid #2a3140}
.bar b{color:#e8edf5;letter-spacing:.06em}
.bar span{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:#8e97a8}
.chart{height:52vh;min-height:380px}
iframe{width:100%;border:0;display:block}
#board{height:200vh}
</style></head><body>
<div class="bar"><b>NQ SYSTEM — LIVE BOARD</b><span id="stamp">board auto-reloads every 60s</span></div>
<div class="chart">
<!-- TradingView official free widget: live NQ chart -->
<div class="tradingview-widget-container" style="height:100%;width:100%">
  <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
  {
  "autosize": true,
  "symbol": "CME_MINI:NQ1!",
  "interval": "5",
  "timezone": "America/New_York",
  "theme": "dark",
  "style": "1",
  "locale": "en",
  "hide_side_toolbar": false,
  "allow_symbol_change": false,
  "support_host": "https://www.tradingview.com"
  }
  </script>
</div>
</div>
<iframe id="board" src="board.html"></iframe>
<script>
setInterval(function(){
  var f=document.getElementById('board');
  f.src='board.html?t='+Date.now();
  document.getElementById('stamp').textContent='report refreshed '+new Date().toLocaleTimeString();
},60000);
</script>
</body></html>
